name: Deploy Lumina to GitHub Pages

# Publishes index.html from this branch to GitHub Pages.
# To take the site down later: Settings → Pages → "Unpublish site",
# or just disable/delete this workflow (and/or set the repo back to Private).

on:
  push:
    branches: ["claude/creative-build-igK2K-fresh"]
  workflow_dispatch: {}        # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true       # auto-enables Pages (source = GitHub Actions) if possible

      - name: Upload site (repo root — contains index.html)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
